<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список справ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Мій список справ</h1>
        <p>Плануй свої завдання легко!</p>

        <form id="taskForm">
            <input type="text" id="taskInput"
                   placeholder="Введіть завдання..."
                   maxlength="150">
            <button type="submit">Додати</button>
        </form>

        <div class="filters">
            <button class="filter active" data-filter="all">Всі</button>
            <button class="filter" data-filter="active">Активні</button>
            <button class="filter" data-filter="completed">Виконані</button>
        </div>

        <ul id="taskList"></ul>

        <p id="counter">Усього: 0 | Не виконано: 0</p>

        <button id="clearCompleted">
            Очистити виконані
        </button>
    </main>
</body>
</html>
